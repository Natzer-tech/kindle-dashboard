name: Generate Kindle Dashboard

on:
  schedule:
    # Startet alle 30 Minuten tagsüber zwischen 05:00 und 20:59 UTC
    - cron: '*/30 5-20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Dashboard generieren
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          LATITUDE: "48.96"
          LONGITUDE: "9.13"
          TIMEZONE: "Europe/Berlin"
        run: |
          python generate.py
          mkdir -p _site
          mv dashboard.png _site/

      - name: Web-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy zu GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
